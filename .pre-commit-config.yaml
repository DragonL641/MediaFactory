repos:
  # Ruff（lint + format），rev 与 dev 组 ruff 版本对齐
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff
        args: [--fix]
        files: ^mediafactory/
      - id: ruff-format
        files: ^mediafactory/

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.2
    hooks:
      - id: bandit
        # 严重级别与 CI 一致：-ll (severity>=low) -ii (confidence>=medium)
        args: ["-ll", "-ii"]
        files: ^mediafactory/

  # 前端检查 — 对齐 CI 流水线 frontend job
  - repo: local
    hooks:
      - id: typecheck
        name: TypeScript type check
        entry: npm run typecheck
        language: system
        types: [ts]
        pass_filenames: false

      - id: eslint
        name: ESLint check
        entry: npx eslint src/
        language: system
        files: ^src/.*\.(ts|tsx)$
        pass_filenames: false

name: Release Management

# 当给仓库打版本标签（git tag -a v1.0.0 -m ""）并推送到 GitHub 时，自动运行。
# Phase 3 Tauri 桌面安装包链：build_darwin.py / build_win.py 内部完成
# PyInstaller 后端 → 组装 src-tauri/python-backend → npm run tauri build → 安装包复制到 release/
# （macOS dmg / Windows NSIS exe），CI 只调这两个入口脚本，构建编排全在脚本内。
# 注意：macOS 已本地全链验证；Windows 无本地环境，为 CI 出包、未真机验证。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  # 构建桌面安装包（Tauri 全链：后端 PyInstaller + 前端 + Tauri 壳）
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          uv sync --group core
          uv pip install pyinstaller
          npm ci

      - name: Build desktop bundle (Windows)
        if: matrix.platform == 'windows'
        run: uv run python scripts/build/build_win.py

      - name: Build desktop bundle (macOS)
        if: matrix.platform == 'macos'
        run: |
          uv run python scripts/build/build_darwin.py
          uv run python scripts/build/build_source.py --zip-only

      # 桌面安装包（release/：macOS dmg / Windows NSIS exe + macOS 侧源码 ZIP）
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}
          path: |
            release/**
          retention-days: 7

  # Create GitHub Release with all artifacts
  create-release:
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Release Notes
        uses: orhun/git-cliff-action@v1
        id: git-cliff
        env:
          TAG_NAME: ${{ github.ref_name }}
        with:
          config: cliff.toml
          args: --tag "$TAG_NAME"

      - name: Write release notes to file
        run: echo '${{ steps.git-cliff.outputs.content }}' > release_notes.md

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

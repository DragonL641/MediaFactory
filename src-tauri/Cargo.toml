[package]
name = "mediafactory-shell"
version = "0.4.0"
description = "MediaFactory 桌面壳：daemon 进程生命周期管理"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

# unix 侧 killpg 整组收割（硬杀兜底用）
[target."cfg(unix)".dependencies]
libc = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
